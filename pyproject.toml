[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-advisor-research"
version = "0.1.1"
description = "Non-personalized model recommendation orchestration for QuantStrategyLab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qar-build-advisory-report = "quant_advisor_research.advisory_report:main"
qar-publish-advisory-site = "quant_advisor_research.publisher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
