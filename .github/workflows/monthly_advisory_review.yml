name: Monthly Intelligent Advisory Review

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Report date. Defaults to current UTC date when empty."
        required: false
        type: string
      political_events_run_id:
        description: "Optional explicit successful PERT Source Event Pipeline run on main. Empty uses the latest successful schedule."
        required: false
        type: string
      theme_momentum_run_id:
        description: "Optional explicit successful RSCP Theme Momentum Snapshot run on main. Empty uses the latest successful schedule."
        required: false
        type: string
      previous_report_path:
        description: "Optional previous advisory report JSON path inside advisor repository checkout."
        required: false
        default: ""
        type: string
      market_confirmation_path:
        description: "Optional market confirmation CSV path inside advisor repository. Empty disables this input."
        required: false
        default: ""
        type: string
      market_data_proxy_urls:
        description: "Optional comma/newline-separated public proxy URLs for free market data fetches."
        required: false
        default: ""
        type: string
      market_data_proxy_pool_url:
        description: "Optional public text URL returning one proxy per line for free market data fetches."
        required: false
        default: ""
        type: string
  schedule:
    - cron: "20 13 1 * *"

permissions:
  contents: read

concurrency:
  group: monthly-advisory-review-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-monthly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout advisor repository
        uses: actions/checkout@v6
        with:
          path: advisor
      - name: Download verified upstream artifacts
        id: upstream
        uses: ./advisor/.github/actions/download-upstream-artifacts
        with:
          token: ${{ secrets.QSL_REPO_SYNC_TOKEN }}
          political_events_run_id: ${{ github.event.inputs.political_events_run_id || '' }}
          theme_momentum_run_id: ${{ github.event.inputs.theme_momentum_run_id || '' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install advisor package
        working-directory: advisor
        run: python -m pip install -e .
      - name: Restore market data cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: advisor/.cache/market-data
          key: ${{ runner.os }}-qar-market-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-qar-market-data-v1-
      - name: Build monthly report and review artifact
        working-directory: advisor
        env:
          INPUT_AS_OF: ${{ github.event.inputs.as_of || '' }}
          PREVIOUS_REPORT_PATH: ${{ github.event.inputs.previous_report_path || '' }}
          POLITICAL_EVENTS_PATH: ${{ steps.upstream.outputs.political_events }}
          POLITICAL_WATCHLIST_PATH: ${{ steps.upstream.outputs.political_watchlist }}
          THEME_MOMENTUM_PATH: ${{ steps.upstream.outputs.theme_momentum }}
          SOURCE_LINEAGE_PATH: ${{ steps.upstream.outputs.source_lineage }}
          MARKET_CONFIRMATION_PATH: ${{ github.event.inputs.market_confirmation_path || '' }}
          MARKET_DATA_PROXY_URLS: ${{ github.event.inputs.market_data_proxy_urls || vars.MARKET_DATA_PROXY_URLS || '' }}
          MARKET_DATA_PROXY_POOL_URL: ${{ github.event.inputs.market_data_proxy_pool_url || vars.MARKET_DATA_PROXY_POOL_URL || '' }}
        run: |
          set -euo pipefail
          AS_OF="${INPUT_AS_OF:-$(date -u +%F)}"
          mkdir -p .cache/market-data
          ARGS=(
            --as-of "${AS_OF}"
            --cadence monthly
            --political-events "${POLITICAL_EVENTS_PATH}"
            --political-watchlist "${POLITICAL_WATCHLIST_PATH}"
            --theme-momentum "${THEME_MOMENTUM_PATH}"
            --source-lineage "${SOURCE_LINEAGE_PATH}"
            --output-dir data/output/monthly_advisory_review
            --monthly-review
            --market-cache-dir .cache/market-data
            --recommendation-review
          )
          if [ -n "${MARKET_CONFIRMATION_PATH}" ]; then
            ARGS+=(--market-confirmation "${MARKET_CONFIRMATION_PATH}")
          fi
          if [ -n "${PREVIOUS_REPORT_PATH}" ]; then
            ARGS+=(--previous-report "${PREVIOUS_REPORT_PATH}")
          fi
          if [ -n "${MARKET_DATA_PROXY_URLS}" ]; then
            ARGS+=(--market-proxy-urls "${MARKET_DATA_PROXY_URLS}")
          fi
          if [ -n "${MARKET_DATA_PROXY_POOL_URL}" ]; then
            ARGS+=(--market-proxy-pool-url "${MARKET_DATA_PROXY_POOL_URL}")
          fi
          python scripts/build_advisory_artifacts.py "${ARGS[@]}"
      - name: Save market data cache
        if: ${{ success() }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: advisor/.cache/market-data
          key: ${{ runner.os }}-qar-market-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload monthly review artifact
        uses: actions/upload-artifact@v7
        with:
          name: monthly-advisory-review
          path: advisor/data/output/monthly_advisory_review/
          if-no-files-found: error
