name: Cross-Repository Advisory Smoke

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Smoke date. Defaults to current UTC date when empty."
        required: false
        type: string
  schedule:
    - cron: "45 11 * * 6"

permissions:
  contents: read

concurrency:
  group: cross-repo-advisory-smoke-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  cross-repo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout advisor repository
        uses: actions/checkout@v6
        with:
          path: advisor
      - name: Download verified upstream artifacts
        id: upstream
        uses: ./advisor/.github/actions/download-upstream-artifacts
        with:
          token: ${{ secrets.QSL_REPO_SYNC_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install advisor package
        working-directory: advisor
        run: python -m pip install -e .
      - name: Run deterministic cross-repo smoke
        working-directory: advisor
        env:
          INPUT_AS_OF: ${{ github.event.inputs.as_of || '' }}
          POLITICAL_EVENTS_PATH: ${{ steps.upstream.outputs.political_events }}
          POLITICAL_WATCHLIST_PATH: ${{ steps.upstream.outputs.political_watchlist }}
          THEME_MOMENTUM_PATH: ${{ steps.upstream.outputs.theme_momentum }}
          SOURCE_LINEAGE_PATH: ${{ steps.upstream.outputs.source_lineage }}
        run: |
          set -euo pipefail
          AS_OF="${INPUT_AS_OF:-$(date -u +%F)}"
          python scripts/run_cross_repo_smoke.py \
            --as-of "${AS_OF}" \
            --political-events "${POLITICAL_EVENTS_PATH}" \
            --political-watchlist "${POLITICAL_WATCHLIST_PATH}" \
            --theme-momentum "${THEME_MOMENTUM_PATH}" \
            --source-lineage "${SOURCE_LINEAGE_PATH}" \
            --work-dir data/output/cross_repo_smoke
      - name: Upload smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: cross-repo-advisory-smoke
          path: advisor/data/output/cross_repo_smoke/
          if-no-files-found: error
